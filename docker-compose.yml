name: hadesgate

services:
  hadesgate:
    build:
      context: .
      dockerfile: Dockerfile
    image: hadesgate:latest
    container_name: hadesgate
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - HADESGATE_BIND_ADDRESS=0.0.0.0
      - HADESGATE_ADMIN_KEY=${HADESGATE_ADMIN_KEY:-}
      - HADESGATE_PROXY_KEY=${HADESGATE_PROXY_KEY:-}
      - HADESGATE_FINGERPRINT_SECRET=${HADESGATE_FINGERPRINT_SECRET:-}
      - HADESGATE_CONFIG_MASTER_KEY=${HADESGATE_CONFIG_MASTER_KEY:?HADESGATE_CONFIG_MASTER_KEY is required}
      - HADESGATE_ALLOW_LEGACY_URL_KEYS=${HADESGATE_ALLOW_LEGACY_URL_KEYS:-false}
      - HADESGATE_ALLOW_PRIVATE_DYNAMIC_UPSTREAM=${HADESGATE_ALLOW_PRIVATE_DYNAMIC_UPSTREAM:-false}
      - HADESGATE_PRIVATE_UPSTREAM_ALLOWED_HOSTS=${HADESGATE_PRIVATE_UPSTREAM_ALLOWED_HOSTS:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - VAULT_TTL=${VAULT_TTL:-10m}
      - HADESGATE_DB_PATH=/app/data/hadesgate.db
      - TRACE_BUFFER_SIZE=${TRACE_BUFFER_SIZE:-1000}
      - HADESGATE_MAX_CONCURRENT_REQUESTS=${HADESGATE_MAX_CONCURRENT_REQUESTS:-128}
      - HADESGATE_MAX_RESPONSE_BYTES=${HADESGATE_MAX_RESPONSE_BYTES:-20971520}
      - HADESGATE_MAX_SSE_EVENT_BYTES=${HADESGATE_MAX_SSE_EVENT_BYTES:-1048576}
      - SEMANTIC_DETECTOR_ENABLED=${SEMANTIC_DETECTOR_ENABLED:-false}
    volumes:
      - hadesgate_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/status"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  hadesgate_data:
