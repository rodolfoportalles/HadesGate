<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HadesGate™ // Escudo Zero-PII</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <!-- TOP COMMAND BAR -->
      <header class="topbar">
        <div class="brand">
          <div class="logo-box" aria-hidden="true">
            <svg

            </svg>
          </div>
          <div>
            <div class="brand-title">
              HADESGATE<span class="tm">™</span>
              <span class="tag-pill">[ BROWSER_SHIELD ]</span>
            </div>
            <div class="brand-sub" data-i18n="subtitle">
              >>> ESCUDO ZERO-PII PARA CHATS DE IA
            </div>
          </div>
        </div>

        <div class="top-controls">
          <button id="langBtn" class="ctrl-btn" title="Idioma / Language">
            PT-BR
          </button>
          <button id="themeBtn" class="ctrl-btn" title="Tema / Theme">
            ESCURO
          </button>
        </div>
      </header>

      <!-- TELEMETRY KPI STRIP -->
      <section class="kpi-grid">
        <div class="kpi-cell">
          <span class="kpi-label" data-i18n="kpiStatus">STATUS GATEWAY</span>
          <div class="status-row">
            <span id="statusDot" class="status-dot offline"></span>
            <data id="statusText" class="kpi-val status-text">VERIFICANDO</data>
          </div>
        </div>
        <div class="kpi-cell">
          <span class="kpi-label" data-i18n="kpiMasked">ASSEGURADOS (RAM)</span>
          <data id="maskedCountVal" class="kpi-val purple">0</data>
        </div>
      </section>

      <!-- NAVIGATION TABS -->
      <nav class="tab-bar">
        <button class="tab-btn active" data-tab="shield" data-i18n="tabShield">
          01 // ESCUDO & CONEXÃO
        </button>
        <button class="tab-btn" data-tab="sandbox" data-i18n="tabSandbox">
          02 // SANDBOX RÁPIDO
        </button>
      </nav>

      <!-- TAB 01: SHIELD & CONNECTION -->
      <main id="tab-shield" class="tab-panel active">
        <div class="section-card">
          <div class="field-group">
            <label for="gatewayUrl" class="field-label" data-i18n="gatewayLabel">
              01 // ENDPOINT DO HADESGATE
            </label>
            <input
              id="gatewayUrl"
              type="url"
              class="brutal-input"
              placeholder="http://localhost:8080"
              spellcheck="false"
            />
          </div>

          <div class="field-group">
            <label for="apiKey" class="field-label" data-i18n="apiKeyLabel">
              02 // CHAVE DE ACESSO
            </label>
            <div class="input-row">
              <input
                id="apiKey"
                type="password"
                class="brutal-input"
                placeholder="••••••••••••••••••••••••"
                spellcheck="false"
              />
              <button id="toggleKeyBtn" type="button" class="icon-btn">
                VER
              </button>
            </div>
          </div>

          <div class="action-row">
            <button id="saveVerifyBtn" type="button" class="btn-purple full">
              <span data-i18n="saveVerifyBtn">SALVAR & VALIDAR CONEXÃO</span>
            </button>
          </div>
          <div id="connFeedback" class="feedback-bar hidden"></div>
        </div>

        <!-- TACTICAL TOGGLES -->
        <div class="section-card switches-card">
          <div class="card-header" data-i18n="tacticalRules">
            DIRETRIZES DE INTERCEPTAÇÃO NOS CHATS
          </div>

          <label class="switch-row">
            <div>
              <div class="switch-title" data-i18n="swEnabledTitle">
                ESCUDO ATIVO NOS CHATS DE IA
              </div>
              <div class="switch-desc" data-i18n="swEnabledDesc">
                ChatGPT, Claude, Gemini, DeepSeek, Perplexity, Grok & Copilot
              </div>
            </div>
            <input id="swEnabled" type="checkbox" class="brutal-checkbox" checked />
          </label>

          <label class="switch-row">
            <div>
              <div class="switch-title" data-i18n="swPasteTitle">
                INTERCEPTAR COLAGEM (CTRL+V)
              </div>
              <div class="switch-desc" data-i18n="swPasteDesc">
                Mascara CPF, PIX, senhas e chaves automaticamente ao colar
              </div>
            </div>
            <input id="swPaste" type="checkbox" class="brutal-checkbox" checked />
          </label>

          <label class="switch-row">
            <div>
              <div class="switch-title" data-i18n="swRestoreTitle">
                AUTO-RESTAURAR RESPOSTAS NA TELA
              </div>
              <div class="switch-desc" data-i18n="swRestoreDesc">
                Substitui tokens [HG_...] pelos dados reais no DOM da conversa
              </div>
            </div>
            <input id="swRestore" type="checkbox" class="brutal-checkbox" checked />
          </label>

          <label class="switch-row">
            <div>
              <div class="switch-title" data-i18n="swFailClosedTitle">
                BLOQUEAR SE O GATEWAY FALHAR
              </div>
              <div class="switch-desc" data-i18n="swFailClosedDesc">
                Não deixa enviar texto cru quando o gateway está fora ou recusa
              </div>
            </div>
            <input id="swFailClosed" type="checkbox" class="brutal-checkbox" checked />
          </label>

          <label class="switch-row">
            <div>
              <div class="switch-title" data-i18n="swDirectiveTitle">
                DIRETIVA ANTI-RECUSA IA
              </div>
              <div class="switch-desc" data-i18n="swDirectiveDesc">
                Instrui a IA web a tratar tokens como dados reais preenchidos
              </div>
            </div>
            <input id="swDirective" type="checkbox" class="brutal-checkbox" checked />
          </label>
        </div>
      </main>

      <!-- TAB 02: QUICK SANDBOX -->
      <main id="tab-sandbox" class="tab-panel">
        <div class="section-card">
          <div class="card-header-flex">
            <span data-i18n="sbInputLabel">TEXTO BRUTO // ÁREA DE TRANSFERÊNCIA</span>
            <span id="sbLatency" class="badge-outline">-- µS</span>
          </div>
          <textarea
            id="sbInput"
            rows="4"
            class="brutal-textarea"
            placeholder="Cole um texto com CPF, PIX, e-mail ou chave de API para mascarar..."
          ></textarea>

          <div class="btn-grid">
            <button id="sbMaskCopyBtn" type="button" class="btn-purple">
              <span data-i18n="sbMaskCopyBtn">MASCARAR & COPIAR</span>
            </button>
            <button id="sbRestoreBtn" type="button" class="btn-secondary">
              <span data-i18n="sbRestoreBtn">RESTAURAR TOKENS</span>
            </button>
          </div>

          <div class="output-block">
            <div class="card-header-flex">
              <span data-i18n="sbOutputLabel">PAYLOAD SANITIZADO</span>
              <span class="badge-purple">[ ZERO_PII_LEAK ]</span>
            </div>
            <pre id="sbOutput" class="sb-pre">[ AGUARDANDO EXECUÇÃO... ]</pre>
            <div id="sbTags" class="tags-row"></div>
          </div>
        </div>
      </main>

      <!-- FOOTER -->
      <footer class="footer">
        <button id="openDashboardBtn" type="button" class="link-btn">
          <span data-i18n="openConsole">ABRIR CONSOLE WEB >>></span>
        </button>
        <button id="purgeRamBtn" type="button" class="purge-btn">
          <span data-i18n="purgeRam">LIMPAR RAM</span>
        </button>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
